name: Testes Automatizados - UI

on:
  push:
    branches: [ CI/CD ]
  pull_request:
    branches: [ CI/CD ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v2

      - name: Configurar Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '18'  # Cypress 14.2.0 exige Node >= 18

      - name: Instalar dependências (UI)
        run: |
          cd ui
          npm install

      - name: Rodar testes de UI
        run: |
          cd ui
          npm test

      - name: Subir relatórios de UI
        if: success()
        run: |
          cd ui
          npm run generate-report
