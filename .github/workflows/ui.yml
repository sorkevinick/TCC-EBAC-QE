name: Testes Automatizados - UI

on:
  push:
    branches: [ CI/CD ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v2

      - name: Configurar Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '18' 

      - name: Instalar dependências (UI)
        run: |
          cd ui
          npm install

      - name: Rodar testes de UI
        run: |
          cd ui
          npx cypress run
